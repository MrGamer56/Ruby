<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
  <title>For You 💕</title>
  <meta name="description" content="A little something for you.">
  <meta name="theme-color" content="#7a2e3a">
  <link rel="icon" href="public/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="manifest" href="public/manifest.json">
</head>

<body>

  <!-- Floating background hearts (all screens) -->
  <div class="bg-float" aria-hidden="true">
    <span class="float-shape s1"></span>
    <span class="float-shape s2"></span>
    <span class="float-shape s3"></span>
    <span class="float-shape s4"></span>
    <span class="float-shape s5"></span>
    <span class="float-shape s6"></span>
  </div>

  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <main id="app" class="app">

    <!-- ===================== SCREEN 1 — THE ENVELOPE ===================== -->
    <section class="screen screen--active" id="screen-1" data-screen="1">
      <div class="screen-inner envelope-screen">
        <p class="hand-label">You have a letter 💌</p>

        <button class="envelope-tap" id="envelopeTap" aria-label="Tap to open the letter">
          <span class="envelope-glow"></span>
          <svg class="envelope-svg" id="envelopeSvg" viewBox="0 0 300 210" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="envBody" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#fffaf3" />
                <stop offset="100%" stop-color="#fff1e6" />
              </linearGradient>
            </defs>
            <!-- back panel -->
            <rect x="10" y="20" width="280" height="180" rx="14" fill="url(#envBody)" stroke="#e8b9a0" stroke-width="2" />
            <!-- inner shadow fold lines -->
            <path d="M14 24 L150 140 L286 24" fill="none" stroke="#f0c9b4" stroke-width="2" />
            <!-- left/right bottom flap shading -->
            <path d="M10 200 L150 110 L10 20 Z" fill="#ffe9da" opacity="0.55" />
            <path d="M290 200 L150 110 L290 20 Z" fill="#ffe9da" opacity="0.55" />
            <!-- front flap (animated) -->
            <g id="envFlap" class="env-flap">
              <path d="M10 20 L150 125 L290 20 Z" fill="#fff4ea" stroke="#e8b9a0" stroke-width="2" stroke-linejoin="round" />
            </g>
            <!-- wax seal -->
            <g id="envSeal" class="env-seal">
              <circle cx="150" cy="112" r="22" fill="#b3324c" />
              <circle cx="150" cy="112" r="22" fill="#000" opacity="0.08" />
              <path d="M150 100c4 3 8 3 10 8s-2 9-10 12c-8-3-12-7-10-12s6-5 10-8z" fill="#fff8f0" opacity="0.85" />
            </g>
          </svg>
          <span class="tap-hint" id="tapHint">tap to open ✨</span>
        </button>
      </div>
    </section>

    <!-- ===================== SCREEN 2 — THE LETTER ===================== -->
    <section class="screen" id="screen-2" data-screen="2">
      <div class="screen-inner">
        <div class="letter-card">
          <span class="sparkle sp1">✦</span>
          <span class="sparkle sp2">✧</span>
          <div class="letter-text" id="letterText">
            <!-- lines injected by JS for the reveal animation; source of truth below -->
          </div>
          <div class="letter-signature">
            <span class="beating-heart">🤍</span>
            <span class="sig-name">— Hamza</span>
          </div>
        </div>

        <button class="ribbon-btn" id="toScreen3" aria-label="Continue">
          <span>Continue</span>
          <span class="ribbon-arrow">↓</span>
        </button>
      </div>
    </section>

    <!-- ===================== SCREEN 3 — MEMORIES CAROUSEL ===================== -->
    <section class="screen" id="screen-3" data-screen="3">
      <div class="screen-inner carousel-screen">
        <h2 class="screen-title">A few reasons, out of many</h2>

        <div class="carousel-wrap">
          <button class="carousel-arrow carousel-arrow--left" id="carPrev" aria-label="Previous">‹</button>

          <div class="carousel-stage" id="carouselStage">
            <!-- cards injected by JS from the MEMORIES array -->
          </div>

          <button class="carousel-arrow carousel-arrow--right" id="carNext" aria-label="Next">›</button>
        </div>

        <div class="carousel-dots" id="carouselDots"></div>

        <button class="ribbon-btn carousel-continue hidden" id="toScreen4" aria-label="Continue">
          <span>Continue</span>
          <span class="ribbon-arrow">↓</span>
        </button>
      </div>
    </section>

    <!-- ===================== SCREEN 4 — ANTICIPATION ===================== -->
    <section class="screen" id="screen-4" data-screen="4">
      <div class="screen-inner anticipation-screen">
        <p class="anticipation-text" id="anticipationText">One more thing&hellip;</p>
        <div class="pulse-heart-wrap">
          <span class="pulse-ring"></span>
          <span class="pulse-ring pulse-ring--delay"></span>
          <span class="pulse-heart">💗</span>
        </div>
      </div>
      <div class="flash-overlay" id="flashOverlay" aria-hidden="true"></div>
    </section>

    <!-- ===================== SCREEN 5 — THE QUESTION ===================== -->
    <section class="screen" id="screen-5" data-screen="5">
      <div class="screen-inner question-screen" id="questionScreen">

        <div class="question-stage" id="questionStage">
          <h1 class="question-heading" id="questionHeading">
            Will you go out with me <span id="dateText">this Saturday</span>?
          </h1>

          <div class="question-buttons" id="questionButtons">
            <button class="btn-yes" id="btnYes">Yes 💕</button>
            <button class="btn-no" id="btnNo">No</button>
          </div>
        </div>

        <!-- YES outcome -->
        <div class="outcome outcome-yes hidden" id="outcomeYes">
          <p class="outcome-emoji">🎉</p>
          <h2 class="outcome-title">Yay!!</h2>
          <p class="outcome-message" id="yesMessage">Can't wait! See you Saturday 💕</p>
          <video class="celebrate-video" id="celebrateVideo" muted loop playsinline preload="none">
            <source src="public/assets/8.mp4" type="video/mp4">
          </video>
        </div>

        <!-- NO outcome -->
        <div class="outcome outcome-no hidden" id="outcomeNo">
          <p class="outcome-emoji deflate" id="deflateHeart">💔</p>
          <h2 class="outcome-title outcome-title--sad">Aw, okay&hellip;</h2>
          <p class="outcome-sub" id="copyStatus">Copied! Send this to him on Instagram 😢</p>
          <p class="outcome-message outcome-message--decline" id="declineMessage">I can't make Saturday, sorry!</p>
        </div>

      </div>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>

</html>
